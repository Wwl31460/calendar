<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f6fb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="日历" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="简洁的农历日历 · 提醒 · 日志 · 课表" />
<title>日历</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/app.css" />
<script src="lib/pdf.min.js"></script>
</head>
<body>

<!-- ============ 图标精灵 ============ -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <g id="ico-base" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9.5 12 15.5 18 9.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="4.8" width="17.6" height="16" rx="3.2"/><path d="M8 2.8v4M16 2.8v4M3.2 10h17.6"/><path d="M7.6 13.6h.01M12 13.6h.01M16.4 13.6h.01M7.6 17.2h.01M12 17.2h.01"/></g></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="3.6" width="17.6" height="16.8" rx="3"/><path d="M3.2 9.2h17.6M3.2 14.8h17.6M9 3.6v16.8M15 3.6v16.8"/></g></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5.6A2.6 2.6 0 0 1 7.6 3H19v18H7.6A2.6 2.6 0 0 1 5 18.4z"/><path d="M9 7.4h6M9 11h4.5"/></g></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18.2 8.6a6.2 6.2 0 1 0-12.4 0c0 6.4-2.6 7.6-2.6 7.6h17.6s-2.6-1.2-2.6-7.6"/><path d="M10.2 20.2a2.1 2.1 0 0 0 3.6 0"/></g></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.4 16.4 20.5 20.5"/></g></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4V12l3 1.9"/></g></symbol>
  <symbol id="i-location" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.2s6.8-6 6.8-10.6a6.8 6.8 0 1 0-13.6 0C5.2 15.2 12 21.2 12 21.2z"/><circle cx="12" cy="10.3" r="2.4"/></g></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.6V3.8M7.4 8.4 12 3.8l4.6 4.6"/><path d="M4 16.6v1.8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.8"/></g></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.8v11.8M7.4 11 12 15.6 16.6 11"/><path d="M4 16.6v1.8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.8"/></g></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.8h15M9.4 6.8V4.6h5.2v2.2"/><path d="M6.6 6.8 7.7 19.4h8.6l1.1-12.6"/><path d="M10.4 10.4v5.4M13.6 10.4v5.4"/></g></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19.2 8.8a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5z"/><path d="M14.6 6.5 17.5 9.4"/></g></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.4 2.6 20 6.2l-3.6 3.6"/><path d="M20 6.2H8.2a4.2 4.2 0 0 0-4.2 4.2v1.2"/><path d="M7.6 21.4 4 17.8l3.6-3.6"/><path d="M4 17.8h11.8a4.2 4.2 0 0 0 4.2-4.2v-1.2"/></g></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.8"/><path d="M12 11.2v5.2M12 8.2v.02"/></g></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.6 9.4 17.5 19.6 6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.6 3H7.4A2.4 2.4 0 0 0 5 5.4v13.2A2.4 2.4 0 0 0 7.4 21h9.2a2.4 2.4 0 0 0 2.4-2.4V8.4z"/><path d="M13.6 3v5.4H19"/></g></symbol>
  <symbol id="i-book2" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 5h6.2a2.2 2.2 0 0 1 2.2 2.2V20a2.2 2.2 0 0 0-2.2-2.2H3.6z"/><path d="M20.4 5h-6.2A2.2 2.2 0 0 0 12 7.2V20a2.2 2.2 0 0 1 2.2-2.2h6.2z"/></g></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.4 8.4 0 0 1 9.4 4a8.6 8.6 0 1 0 10.6 10.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6 6 18M18 6l1.6-1.6"/></g></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6 21 20H3z"/><path d="M12 9.6v5M12 17.6v.02"/></g></symbol>
</svg>

<div class="app">

  <!-- ================= 日历 ================= -->
  <main id="view-calendar" class="view active">
    <header class="topbar">
      <div class="tb-left">
        <button class="icon-btn" id="cal-prev" aria-label="上个月"><svg><use href="#i-left"/></svg></button>
        <div class="tb-title">
          <h1 id="cal-ym">2026年11月</h1>
          <div class="tb-sub" id="cal-lunar">农历丙午年 十月</div>
        </div>
        <button class="icon-btn" id="cal-next" aria-label="下个月"><svg><use href="#i-right"/></svg></button>
      </div>
      <div class="tb-right">
        <button class="pill-btn" id="cal-today">今天</button>
        <button class="icon-btn" id="cal-settings" aria-label="设置"><svg><use href="#i-settings"/></svg></button>
      </div>
    </header>

    <div class="weekbar" id="weekbar"></div>
    <div class="month-wrap" id="month-wrap">
      <div class="month-grid" id="month-grid"></div>
    </div>
    <div class="agenda" id="agenda"></div>
  </main>

  <!-- ================= 课表 ================= -->
  <main id="view-timetable" class="view">
    <header class="topbar">
      <div class="tb-left">
        <button class="icon-btn" id="tt-prev" aria-label="上一周"><svg><use href="#i-left"/></svg></button>
        <div class="tb-title">
          <h1 id="tt-week">第 1 周</h1>
          <div class="tb-sub" id="tt-range">未设置学期</div>
        </div>
        <button class="icon-btn" id="tt-next" aria-label="下一周"><svg><use href="#i-right"/></svg></button>
      </div>
      <div class="tb-right">
        <button class="pill-btn ghost" id="tt-import">导入</button>
        <button class="icon-btn" id="tt-add" aria-label="添加课程"><svg><use href="#i-plus"/></svg></button>
      </div>
    </header>
    <div id="tt-pdf"></div>
    <div class="tt-wrap" id="tt-wrap">
      <div class="tt-grid" id="tt-grid"></div>
    </div>
    <div class="tt-legend" id="tt-legend"></div>
  </main>

  <!-- ================= 日志 ================= -->
  <main id="view-notes" class="view">
    <header class="topbar">
      <div class="tb-title">
        <h1>日志</h1>
        <div class="tb-sub" id="notes-sub">还没有记录</div>
      </div>
      <div class="tb-right">
        <button class="icon-btn" id="notes-search-btn" aria-label="搜索"><svg><use href="#i-search"/></svg></button>
        <button class="icon-btn" id="notes-add" aria-label="写日志"><svg><use href="#i-plus"/></svg></button>
      </div>
    </header>
    <div class="notes-tools" id="notes-tools" hidden>
      <div class="search-box">
        <svg><use href="#i-search"/></svg>
        <input id="notes-search" type="search" placeholder="搜索日志内容…" autocomplete="off" />
        <button class="icon-btn" id="notes-search-close" style="width:26px;height:26px"><svg style="width:15px;height:15px"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="notes-list" id="notes-list"></div>
  </main>

  <!-- ================= 提醒 ================= -->
  <main id="view-reminders" class="view">
    <header class="topbar">
      <div class="tb-title">
        <h1>提醒</h1>
        <div class="tb-sub" id="rem-sub">暂无提醒</div>
      </div>
      <div class="tb-right">
        <button class="icon-btn" id="rem-add" aria-label="新建提醒"><svg><use href="#i-plus"/></svg></button>
      </div>
    </header>
    <div class="rem-list" id="rem-list"></div>
  </main>

  <!-- ================= 设置 ================= -->
  <main id="view-settings" class="view">
    <header class="topbar">
      <div class="tb-left">
        <button class="icon-btn" id="set-back" aria-label="返回"><svg><use href="#i-left"/></svg></button>
        <div class="tb-title"><h1>设置</h1></div>
      </div>
    </header>
    <div style="padding:0 12px" id="settings-body"></div>
  </main>

  <!-- ================= 底部导航 ================= -->
  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab active" data-tab="calendar">
        <svg><use href="#i-calendar"/></svg><span>日历</span>
      </button>
      <button class="tab" data-tab="timetable">
        <svg><use href="#i-grid"/></svg><span>课表</span>
      </button>
      <button class="tab" data-tab="notes">
        <svg><use href="#i-book"/></svg><span>日志</span>
      </button>
      <button class="tab" data-tab="reminders">
        <svg><use href="#i-bell"/></svg><span>提醒</span>
      </button>
    </div>
  </nav>
</div>

<!-- ============ 登录 / 注册 ============ -->
<div class="auth" id="auth-screen" hidden>
  <div class="auth-inner">
    <div class="auth-brand">
      <div class="auth-mark"><svg><use href="#i-calendar"/></svg></div>
      <h2 id="auth-title">登录</h2>
      <p class="auth-sub" id="auth-sub">换设备登录同一账号，日志、提醒、课表都还在</p>
    </div>

    <form id="auth-form" class="auth-form">
      <div class="field">
        <label for="auth-user">用户名</label>
        <input class="input" id="auth-user" type="text" autocomplete="username" placeholder="例如 吴文林"
               autocapitalize="off" autocorrect="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="auth-pass">密码</label>
        <input class="input" id="auth-pass" type="password" autocomplete="current-password" placeholder="请输入密码" />
      </div>
      <p class="auth-err" id="auth-err"></p>
      <button class="btn primary auth-submit" id="auth-submit" type="submit">登录</button>
    </form>

    <button class="auth-link" id="auth-toggle" type="button">还没有账号？注册一个</button>
    <button class="auth-link muted" id="auth-skip" type="button">先不登录，只用本机数据</button>
    <p class="auth-hint" id="auth-hint">初始账号 吴文林 · 密码 123456（点这里填入）</p>
  </div>
</div>

<div id="sheet-root"></div>
<div class="toast-root" id="toast-root"></div>

<script src="lib/workbuddy-cloud.global.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
